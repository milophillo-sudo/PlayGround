      <path d="M82 20 L54 150"/><path d="M176 0 L150 110"/><path d="M640 40 L612 176"/>
      <path d="M556 0 L530 126"/><path d="M298 30 L278 128"/><path d="M452 0 L428 92"/>
      <path d="M688 220 L666 328"/><path d="M42 270 L22 368"/><path d="M126 360 L108 446"/>
    </g>
    <!-- shoulders / oversized hoodie -->
    <path d="M92 900 C102 714 178 632 306 606 L356 680 L374 900Z" fill="url(#hoodie)"/>
    <path d="M628 900 C618 714 542 632 414 606 L364 680 L346 900Z" fill="url(#hoodie)"/>
    <path d="M296 606 C318 654 366 672 414 606 L444 620 C400 716 306 716 266 620Z" fill="#090d18" stroke="#ffd166" stroke-opacity=".28" stroke-width="2"/>
    <!-- hood -->
    <path d="M228 640 C230 556 300 520 360 520 C430 520 500 562 496 648 C480 590 430 562 360 562 C300 562 250 590 228 640Z" fill="#0b101d" stroke="#6e83ad" stroke-opacity=".25" stroke-width="2"/>
