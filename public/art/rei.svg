    <g fill="none" stroke="#ffd166" stroke-width="2" opacity=".65" filter="url(#tinyGlow)">
      <path d="M150 742 L208 708 L252 764 L318 730 L350 794"/>
      <path d="M508 700 L552 734 L586 704 L604 772 L548 818"/>
