<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-label="REI — bassist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030812"/>
      <stop offset=".5" stop-color="#071426"/>
      <stop offset="1" stop-color="#110d22"/>
    </linearGradient>
    <radialGradient id="spot" cx=".7" cy=".16" r=".82">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".34"/>
      <stop offset=".42" stop-color="#3775ff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#030812" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rain" cx=".5" cy=".1" r=".9">
      <stop offset="0" stop-color="#8fdcff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8fdcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffe9dd"/>
      <stop offset=".55" stop-color="#f2c6b8"/>
      <stop offset="1" stop-color="#c58c86"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18263d"/>
      <stop offset=".45" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#03060d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset=".42" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#b98122"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161c2c"/>
      <stop offset=".55" stop-color="#0b0f1b"/>
      <stop offset="1" stop-color="#171326"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d7ff"/>
      <stop offset=".35" stop-color="#b68cff"/>
      <stop offset=".72" stop-color="#6e50c8"/>
      <stop offset="1" stop-color="#26134d"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.4"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="720" height="900"/></clipPath>
    <pattern id="rainPattern" width="26" height="38" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <line x1="2" y1="0" x2="2" y2="24" stroke="#b8eaff" stroke-width="1" opacity=".18"/>
    </pattern>
  </defs>
  <g clip-path="url(#card)">
    <rect width="720" height="900" fill="url(#bg)"/>
    <rect width="720" height="900" fill="url(#spot)"/>
    <rect width="720" height="900" fill="url(#rain)"/>
    <rect width="720" height="900" fill="url(#rainPattern)" opacity=".8"/>
    <!-- distant rooftop -->
    <g opacity=".55">
      <path d="M0 620 L90 620 L90 560 L150 560 L150 602 L230 602 L230 520 L286 520 L286 610 L390 610 L390 546 L470 546 L470 616 L560 616 L560 506 L626 506 L626 620 L720 620 L720 900 L0 900Z" fill="#040b17"/>
      <g fill="#ffd166" opacity=".5">
