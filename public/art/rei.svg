        <rect x="246" y="548" width="5" height="4"/><rect x="268" y="574" width="5" height="4"/>
        <rect x="584" y="536" width="5" height="4"/><rect x="604" y="568" width="5" height="4"/>
      </g>
      <path d="M0 684 L130 660 L270 690 L430 654 L590 688 L720 662 L720 900 L0 900Z" fill="#07101f" opacity=".9"/>
