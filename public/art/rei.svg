      <circle cx="318" cy="730" r="2.4"/><circle cx="350" cy="794" r="2.8"/>
      <circle cx="508" cy="700" r="2.6"/><circle cx="552" cy="734" r="3"/><circle cx="586" cy="704" r="2.2"/>
      <circle cx="604" cy="772" r="2.6"/><circle cx="548" cy="818" r="3"/>
    </g>
    <!-- neck -->
    <path d="M310 530 L304 626 C330 656 390 656 416 624 L410 528Z" fill="url(#skin)"/>
    <path d="M310 560 C334 628 388 630 410 560 L410 606 C388 642 332 640 306 606Z" fill="#b97c73" opacity=".5"/>
    <!-- necklace + bass pick -->
    <path d="M312 626 C340 688 388 698 416 632" fill="none" stroke="#b5c6df" stroke-width="1.8" opacity=".8"/>
    <path d="M366 684 L398 712 L366 754 L336 712Z" fill="#ffd166" stroke="#fff1b5" stroke-width="2.4" filter="url(#tinyGlow)"/>
    <path d="M360 704 L376 720 L364 736 L350 720Z" fill="#171027" opacity=".85"/>
    <!-- head -->
    <path d="M264 320 C268 238 314 196 366 196 C428 196 470 246 472 326 C474 402 446 486 404 524 C380 548 346 550 322 528 C278 488 260 400 264 320Z" fill="url(#skin)"/>
    <!-- ears -->
    <path d="M262 342 C246 330 232 346 240 382 C246 412 256 430 270 432Z" fill="#efb5a8"/>
    <path d="M472 342 C488 330 502 346 494 382 C488 412 478 430 464 432Z" fill="#efb5a8"/>
