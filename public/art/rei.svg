    <path d="M240 330 C214 232 286 142 374 138 C476 132 534 210 498 342 C524 408 526 550 490 700 L450 664 C470 542 466 432 444 360 C408 402 330 408 290 356 C282 468 288 578 306 676 L268 708 C238 566 232 430 240 330Z" fill="url(#hair)"/>
    <path d="M252 360 C230 474 238 592 260 700 L286 674 C270 568 266 456 280 370Z" fill="#0a1424" opacity=".8"/>
    <path d="M488 360 C510 474 504 590 482 700 L456 674 C472 568 474 456 462 370Z" fill="#0a1424" opacity=".8"/>
    <!-- front hair -->
    <path d="M254 326 C242 250 288 186 366 178 C450 172 500 232 490 326 C474 292 456 270 430 258 C436 292 426 318 406 338 C402 298 390 272 366 252 C352 294 330 320 300 338 C298 306 290 284 276 270 C266 290 260 306 254 326Z" fill="url(#hair)"/>
    <path d="M286 218 C338 184 412 182 462 220 C420 198 350 196 304 226Z" fill="#263c5a" opacity=".45"/>
    <!-- pale gold streak -->
    <path d="M432 190 C458 246 462 310 440 356 C452 302 446 242 418 200Z" fill="#ffe8a8" opacity=".82" filter="url(#tinyGlow)"/>
    <!-- crescent hair clips -->
    <g filter="url(#tinyGlow)">
      <path d="M300 246 C318 226 344 224 360 240 C338 236 318 240 306 256Z" fill="#ffd166"/>
      <path d="M284 278 C302 260 326 258 342 272 C322 268 302 272 290 288Z" fill="#ffd166" opacity=".9"/>
      <circle cx="310" cy="250" r="2.2" fill="#fff8d0"/>
      <circle cx="294" cy="282" r="2" fill="#fff8d0"/>
    </g>
    <!-- eyebrows -->
    <path d="M294 340 C314 330 338 332 352 340" fill="none" stroke="#181629" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M400 338 C416 328 440 330 456 340" fill="none" stroke="#181629" stroke-width="5.5" stroke-linecap="round"/>
    <!-- eyes, calm and downcast -->
    <g>
      <path d="M288 378 C310 358 344 360 362 382 C342 402 310 404 288 378Z" fill="#fff8f2"/>
      <path d="M400 378 C420 358 452 360 472 382 C452 404 420 402 400 378Z" fill="#fff8f2"/>
      <ellipse cx="330" cy="380" rx="16" ry="21" fill="url(#iris)"/>
      <ellipse cx="438" cy="380" rx="16" ry="21" fill="url(#iris)"/>
      <ellipse cx="330" cy="384" rx="7" ry="14" fill="#150a2a"/>
      <ellipse cx="438" cy="384" rx="7" ry="14" fill="#150a2a"/>
      <circle cx="324" cy="370" r="5.4" fill="#fff"/>
      <circle cx="432" cy="370" r="5.4" fill="#fff"/>
      <circle cx="336" cy="392" r="2.6" fill="#fff" opacity=".75"/>
      <circle cx="444" cy="392" r="2.6" fill="#fff" opacity=".75"/>
      <path d="M288 378 C310 356 344 358 364 380" fill="none" stroke="#120f20" stroke-width="5.4" stroke-linecap="round"/>
      <path d="M398 380 C418 356 452 358 474 378" fill="none" stroke="#120f20" stroke-width="5.4" stroke-linecap="round"/>
      <path d="M292 372 L278 366" stroke="#120f20" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M470 372 L484 366" stroke="#120f20" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M302 394 C314 400 326 400 336 396" stroke="#b77c8b" stroke-width="1.4" opacity=".4"/>
      <path d="M430 396 C440 400 452 400 464 394" stroke="#b77c8b" stroke-width="1.4" opacity=".4"/>
    </g>
    <!-- nose + mouth -->
    <path d="M370 406 C364 432 366 448 376 454" fill="none" stroke="#b37b73" stroke-width="3" stroke-linecap="round" opacity=".75"/>
    <path d="M346 490 C360 492 380 491 394 486" fill="none" stroke="#8d4d5a" stroke-width="3.6" stroke-linecap="round"/>
    <!-- star mole -->
    <path d="M440 438 l2.2 5 5.2 .6 -4 3.2 1.3 5.2 -4.7 -2.8 -4.7 2.8 1.3 -5.2 -4 -3.2 5.2 -.6Z" fill="#c79474" opacity=".8"/>
    <!-- blush -->
    <ellipse cx="298" cy="426" rx="24" ry="9" fill="#e68c95" opacity=".2"/>
    <ellipse cx="456" cy="426" rx="24" ry="9" fill="#e68c95" opacity=".2"/>
    <!-- wired earbuds around neck -->
    <path d="M300 606 C292 688 318 728 366 734 C414 728 440 686 430 606" fill="none" stroke="#0a0d16" stroke-width="6" stroke-linecap="round"/>
    <path d="M300 606 C292 688 318 728 366 734 C414 728 440 686 430 606" fill="none" stroke="#82e7ff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
    <g>
      <ellipse cx="292" cy="604" rx="15" ry="19" fill="#111827" stroke="#7ceaff" stroke-width="2"/>
      <ellipse cx="438" cy="604" rx="15" ry="19" fill="#111827" stroke="#ffd166" stroke-width="2"/>
      <circle cx="292" cy="604" r="5" fill="#7ceaff" opacity=".85"/>
      <circle cx="438" cy="604" r="5" fill="#ffd166" opacity=".85"/>
    </g>
    <!-- bandaged fingertips -->
    <g fill="#eadccd" opacity=".9">
      <rect x="486" y="856" width="30" height="18" rx="8" transform="rotate(-12 486 856)"/>
      <rect x="532" y="848" width="26" height="16" rx="7" transform="rotate(8 532 848)"/>
    </g>
    <!-- frame corners -->
    <g stroke="#ffd166" stroke-width="2" opacity=".55">
      <path d="M24 76 L24 24 L92 24"/><path d="M628 24 L696 24 L696 76"/>
      <path d="M24 824 L24 876 L92 876"/><path d="M628 876 L696 876 L696 824"/>
    </g>
    <text x="44" y="64" font-family="monospace" font-size="13" letter-spacing="5" fill="#ffe9a8">02 / REI</text>
    <text x="474" y="854" font-family="monospace" font-size="11" letter-spacing="4" fill="#a8e4ff">BASS / SIGNAL</text>
    <g opacity=".7">
      <rect x="508" y="52" width="150" height="18" fill="#081221" stroke="#ffd166" stroke-width="1"/>
      <text x="518" y="65" font-family="monospace" font-size="9" letter-spacing="2.4" fill="#ffe9a8">SIGNAL / LOW</text>
    </g>
  </g>
</svg>
